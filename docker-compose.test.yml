services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.ci
      target: builder
    working_dir: /app
    # Coverage is extracted by the Jenkins "Unit Tests" stage via `docker cp`
    # (DinD-safe); no bind mount — under DinD it resolves to a stray host path.
    command: sh -c "npx vitest run --coverage"
